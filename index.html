<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>フードサプライズ｜介護施設・保育園むけ 商談スライド</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
 --navy:#213039;--navy2:#17242B;--ink:#2B3740;--inkSoft:#54606A;--mute:#8E8779;
 --verm:#BE4A2E;--vermT:#F6E9E2;--gold:#A87F33;--gold2:#E6CB8C;--green:#3C7657;
 --paper:#FBF7EF;--paper2:#F1E8D9;--line:#E7DECB;--line2:#EFE7D8;
 --serif:'Shippori Mincho B1','Noto Serif JP',serif;
 --radius:18px;--radius-sm:12px;
 --sh-sm:0 2px 10px -4px rgba(58,42,18,.16);
 --sh:0 26px 54px -30px rgba(48,34,14,.34);
 --sh-lift:0 34px 60px -28px rgba(48,34,14,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#12161a;font-family:'Noto Sans JP',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer}
/* stage */
.stagewrap{position:relative;overflow:hidden}
.stage{position:absolute;top:0;left:0;width:1280px;height:720px;background:linear-gradient(157deg,#FCF9F2 0%,#F6EFE1 62%,#F1E7D6 100%);transform-origin:top left;overflow:hidden;color:var(--ink)}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 88% -10%,rgba(168,127,51,.06),transparent 55%);pointer-events:none}
.stage.dark{background:linear-gradient(155deg,#26363F 0%,#1a2830 100%)}
.pad{position:absolute;inset:0;padding:60px 74px}
.pad-band{padding:196px 74px 62px}
.pad-navy{background:linear-gradient(155deg,#26363F 0%,#1A272E 100%);padding:60px 74px;color:#fff}
.pad-navy:before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 82% 6%,rgba(230,203,140,.10),transparent 60%);pointer-events:none}
/* eyebrow + title */
.kick{display:inline-flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:.24em;color:var(--gold)}
.kick:before{content:"";width:26px;height:2px;background:currentColor;opacity:.85;border-radius:2px}
.ttl{font-family:var(--serif);font-weight:700;font-size:43px;line-height:1.34;color:var(--navy);margin-top:16px;letter-spacing:.015em}
.pad-navy .ttl{color:#fff}
.foot{position:absolute;left:74px;right:74px;bottom:28px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;letter-spacing:.06em;color:var(--mute)}
.foot:before{content:"";position:absolute;top:-15px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.pad-navy .foot{color:#93a0a8}
.pad-navy .foot:before{background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
.lead{font-size:19px;line-height:1.78;color:var(--inkSoft);max-width:1040px;letter-spacing:.01em}
.lead b{color:var(--navy);font-weight:700}
.note-c{font-size:14.5px;line-height:1.7;color:var(--mute);letter-spacing:.02em}
/* cover */
.s-cover{position:absolute;inset:0;background:linear-gradient(150deg,#26363F 0%,#1B282F 55%,#141F25 100%);display:flex}
.cov-l{width:63%;padding:104px 0 0 84px;position:relative;z-index:2}
.cov-eyebrow{display:inline-flex;align-items:center;gap:13px;color:var(--gold2);letter-spacing:.22em;font-weight:700;font-size:14px}
.cov-eyebrow:before{content:"";width:30px;height:2px;background:linear-gradient(90deg,var(--gold2),rgba(230,203,140,.2));border-radius:2px}
.cov-ttl{font-family:var(--serif);font-weight:700;font-size:63px;line-height:1.32;color:#fff;margin-top:28px;letter-spacing:.02em;position:relative}
.cov-ttl:after{content:"";display:block;width:64px;height:3px;margin-top:26px;background:linear-gradient(90deg,var(--gold2),rgba(230,203,140,.15));border-radius:3px}
.cov-sub{color:#d6dde2;font-size:17.5px;line-height:1.9;margin-top:28px;max-width:560px;letter-spacing:.01em}
.cov-chips{display:flex;gap:10px;margin-top:38px;flex-wrap:wrap}
.cov-chips span{border:1px solid rgba(230,203,140,.42);background:rgba(230,203,140,.07);color:var(--gold2);font-size:13.5px;letter-spacing:.04em;padding:8px 17px;border-radius:999px;backdrop-filter:blur(2px)}
.cov-r{position:absolute;right:0;top:0;width:47%;height:100%;background-size:cover;background-position:center}
.cov-r:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 70% 50%,transparent 40%,rgba(20,31,37,.35) 100%)}
.cov-r-fade{position:absolute;inset:0;background:linear-gradient(90deg,#1B282F 0%,rgba(27,40,47,.55) 26%,rgba(27,40,47,0) 68%);z-index:1}
.cov-foot{position:absolute;left:84px;bottom:44px;color:#93a0a8;font-size:13.5px;letter-spacing:.08em;z-index:2}
/* panels */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.panel-soft,.panel-tint,.panel-navy,.panel-white{border-radius:var(--radius);padding:32px 34px}
.panel-soft{background:#fff;border:1px solid var(--line);box-shadow:var(--sh-sm)}
.panel-tint{background:linear-gradient(160deg,#F8ECE4,#F5E6DC);border:1px solid #EEDBCF}
.panel-navy{background:linear-gradient(158deg,#28383F,#1B282E);color:#fff;box-shadow:var(--sh)}
.panel-white{background:#fff;border:1px solid var(--line);box-shadow:var(--sh-sm)}
.ph{font-weight:700;font-size:16.5px;color:var(--navy);margin-bottom:15px;letter-spacing:.02em}
.ph.gold{color:var(--gold2)}.ph.verm{color:var(--verm)}.ph.light{color:#fff}
.pp{font-size:16px;line-height:1.85;color:var(--inkSoft);letter-spacing:.01em}
.pp.light{color:#dbe1e4}.pp b{color:var(--navy);font-weight:700}.pp.light b{color:var(--gold2)}
/* positioning */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:32px 26px;text-align:center;box-shadow:var(--sh-sm)}
.pcard-h{font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.02em}
.pcard-arrow{color:var(--mute);font-size:20px;margin:12px 0}
.pcard-b{font-size:16px;color:var(--inkSoft);line-height:1.65}
/* threeways */
.wcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:0 28px 28px;overflow:hidden;box-shadow:var(--sh-sm)}
.wbar{height:6px;margin:0 -28px 24px}
.wcard-h{font-family:var(--serif);font-weight:700;font-size:23px;color:var(--navy);letter-spacing:.02em}
.wcard-b{font-size:15.5px;color:var(--inkSoft);line-height:1.65;margin-top:12px;min-height:48px}
.wcard-t{font-weight:700;font-size:15px;margin-top:14px}
/* hub */
.hubgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.hubcard{display:flex;flex-direction:column;align-items:flex-start;gap:11px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--ic);border-radius:var(--radius);padding:26px 26px;text-align:left;transition:transform .18s ease,box-shadow .18s ease,background .18s;box-shadow:var(--sh-sm)}
.hubcard:hover{background:var(--it);transform:translateY(-4px);box-shadow:var(--sh-lift)}
.hub-ic{width:48px;height:48px;border-radius:50%;background:var(--it);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.hub-ic svg{width:30px;height:30px}
.hub-name{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--navy);letter-spacing:.02em}
.hub-go{font-size:13.5px;color:var(--ic);font-weight:700;letter-spacing:.03em}
.hub-foot-row{display:flex;gap:14px;margin-top:24px}
/* band (section header) */
.band{position:absolute;top:0;left:0;right:0;height:162px;padding:44px 74px;color:#fff;overflow:hidden}
.band:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.10),transparent 45%),radial-gradient(80% 140% at 92% -20%,rgba(0,0,0,.16),transparent 60%);pointer-events:none}
.band:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold2),rgba(230,203,140,.25) 60%,transparent)}
.band-kick{font-weight:700;font-size:13.5px;letter-spacing:.2em;opacity:.94;position:relative}
.band-name{font-family:var(--serif);font-weight:700;font-size:41px;margin-top:9px;letter-spacing:.03em;position:relative}
.band-ic{position:absolute;right:74px;top:50%;transform:translateY(-50%);width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.band-ic svg{width:46px;height:46px}
.ab{display:grid;grid-template-columns:1.35fr 1fr;gap:34px}
.sub{font-weight:700;font-size:15px;letter-spacing:.14em;margin-bottom:16px}
.tcard{display:flex;gap:15px;align-items:center;border-radius:14px;padding:17px 22px;margin-bottom:13px;font-size:16px;color:var(--ink);line-height:1.55;border:1px solid rgba(0,0,0,.03)}
.tarrow{font-weight:700;font-size:18px;flex:none}
.ab-r{background:linear-gradient(158deg,#28383F,#1A272D);border-radius:var(--radius);padding:32px;box-shadow:var(--sh)}
.issue-h{color:var(--gold2);font-weight:700;font-size:15px;letter-spacing:.1em;margin-bottom:16px}
.issue-b{font-family:var(--serif);font-weight:700;font-size:24px;color:#fff;line-height:1.6;letter-spacing:.02em}
.band-navrow{position:absolute;right:74px;bottom:72px}
/* bc */
.bc{display:grid;grid-template-columns:1fr 1.25fr;gap:30px}
.bc-h{font-weight:700;font-size:15px;letter-spacing:.08em;margin-bottom:14px}
.bc-reason{background:var(--it);border-radius:var(--radius);padding:32px;border-left:5px solid var(--ic)}
.bc-reason-b{font-size:19px;line-height:1.85;color:var(--ink);font-weight:500}
.scenes{display:flex;flex-wrap:wrap;gap:11px}
.scene{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ic);border-radius:11px;padding:13px 18px;font-size:15.5px;color:var(--ink);box-shadow:var(--sh-sm)}
.budgets{display:flex;flex-wrap:wrap;gap:9px}
.budget{background:linear-gradient(150deg,#28383F,#1B282E);color:#fff;font-size:13px;letter-spacing:.03em;padding:8px 16px;border-radius:999px}
/* indD */
.qwrap{display:flex;flex-direction:column;gap:16px}
.qcard{display:flex;gap:20px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 28px;box-shadow:var(--sh-sm)}
.qn{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--ic);flex:none;width:46px}
.qt{font-size:17.5px;color:var(--ink);line-height:1.55}
.dnav{position:absolute;right:74px;bottom:72px;display:flex;gap:14px}
/* flow */
.flow{display:flex;align-items:stretch;gap:0}
.fstep{flex:1;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 22px;text-align:center;box-shadow:var(--sh-sm)}
.fnum{width:46px;height:46px;border-radius:50%;background:linear-gradient(150deg,#4a8a68,#356a4d);color:#fff;font-family:var(--serif);font-weight:700;font-size:20px;display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 8px 18px -8px rgba(60,118,87,.7)}
.fh{font-weight:700;font-size:16.5px;color:var(--navy);margin-bottom:10px}
.fb{font-size:14px;color:var(--inkSoft);line-height:1.6}
.farrow{align-self:center;color:#b9a05f;font-size:22px;font-weight:700;padding:0 10px}
/* pricing */
.price{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:20px}
.pc{border-radius:var(--radius);padding:28px 30px;position:relative;overflow:hidden}
.pc-navy{background:linear-gradient(158deg,#2A3A41,#18252B);color:#fff;box-shadow:var(--sh)}
.pc-navy:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(230,203,140,.5),transparent)}
.pc-paper{background:#fff;border:1px solid var(--line);box-shadow:var(--sh-sm)}
.pc-tint{background:linear-gradient(160deg,#F8ECE4,#F4E4D9);border:1px solid #EEDBCF}
.pc-badge{position:absolute;top:24px;right:24px;background:linear-gradient(135deg,#E6CB8C,#C9A85C);color:#2A3740;font-weight:700;font-size:11.5px;letter-spacing:.05em;padding:6px 14px;border-radius:999px}
.pc-name{font-weight:700;font-size:15.5px;letter-spacing:.04em;margin-bottom:14px}
.pc-name.gold{color:var(--gold2)}.pc-name.verm{color:var(--verm)}
.pc-amt{font-family:var(--serif);line-height:1;letter-spacing:.01em}
.pc-amt b{font-size:54px}.pc-unit{font-size:20px;margin-left:6px}
.pc-amt.dark{color:var(--navy)}
.pc-per{font-size:14px;margin-top:9px;color:#c6cfd3}.pc-per.mute{color:var(--mute)}
.pc-desc{font-size:14px;line-height:1.65;margin-top:16px;color:var(--inkSoft)}.pc-desc.light{color:#c6cfd3}
.pc-mix{font-size:15px;line-height:1.7;color:var(--ink);margin-bottom:14px}.pc-mix b{color:var(--verm)}
.pc-mix2{font-size:13.5px;line-height:1.65;color:var(--inkSoft)}
.price-note{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:22px 28px;box-shadow:var(--sh-sm)}
.pn-h{display:block;font-weight:700;color:var(--navy);font-size:15px;margin-bottom:8px;letter-spacing:.03em}
.pn-b{font-size:14.5px;color:var(--inkSoft);line-height:1.65}
/* grid4 */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.icard{background:#fff;border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:var(--radius);padding:28px 24px;box-shadow:var(--sh-sm)}
.ic-h{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--navy);margin-bottom:12px;letter-spacing:.02em}
.ic-b{font-size:14.5px;color:var(--inkSoft);line-height:1.65}
.nscard{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:24px 24px;box-shadow:var(--sh-sm)}
.ns-n{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--green)}
.ns-h{font-weight:700;font-size:17.5px;color:var(--navy);margin:8px 0 10px;letter-spacing:.02em}
.ns-b{font-size:14px;color:var(--inkSoft);line-height:1.6}
.sched{margin-top:26px;background:linear-gradient(150deg,#28383F,#1A272D);border-radius:var(--radius-sm);padding:24px 30px;color:#fff;display:flex;gap:22px;align-items:baseline;box-shadow:var(--sh)}
.sched-h{font-weight:700;color:var(--gold2);font-size:16px;letter-spacing:.04em;flex:none}
.sched-b{font-size:15px;line-height:1.65;color:#dbe1e4}
/* timeline */
.tl{position:relative;display:flex;justify-content:space-between;padding:0 28px}
.tl-line{position:absolute;top:11px;left:64px;right:64px;height:2px;background:linear-gradient(90deg,var(--line),#d8c9a8,var(--line))}
.tl-node{position:relative;text-align:center;width:18%}
.tl-dot{width:22px;height:22px;border-radius:50%;margin:0 auto 20px;position:relative;z-index:2;box-shadow:0 0 0 5px var(--paper),0 8px 16px -6px rgba(0,0,0,.28)}
.tl-dot:after{content:"";position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);width:1px;height:12px;background:var(--line)}
.tl-mo{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--navy);letter-spacing:.03em}
.tl-f{font-size:15px;color:var(--inkSoft);margin-top:8px;line-height:1.45}
/* logistics */
.speclist{display:flex;flex-direction:column;gap:12px}
.spec{display:flex;gap:18px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 22px;box-shadow:var(--sh-sm)}
.spec-a{font-weight:700;color:var(--navy);font-size:15px;width:104px;flex:none;letter-spacing:.02em}
.spec-b{font-size:14.5px;color:var(--inkSoft);line-height:1.55}
.notelist{list-style:none;display:flex;flex-direction:column;gap:14px}
.notelist li{font-size:15px;color:var(--ink);line-height:1.6;padding-left:24px;position:relative}
.notelist li:before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--verm)}
/* faq */
.faq{display:grid;grid-template-columns:1fr 1fr;gap:18px 36px}
.fq{border-bottom:1px solid var(--line);padding-bottom:15px}
.fq-q{font-weight:700;font-size:15.5px;color:var(--navy);display:flex;gap:11px;align-items:baseline;letter-spacing:.02em}
.fq-n{color:var(--verm);font-family:var(--serif);font-weight:700}
.fq-a{font-size:14px;color:var(--inkSoft);line-height:1.65;margin-top:8px}
/* closing */
.ckrow{display:flex;gap:15px;align-items:flex-start;color:#e9edef;font-size:17px;line-height:1.65;margin-bottom:18px}
.ck{color:var(--gold2);font-weight:700;flex:none}
.userow{font-size:16px;color:var(--ink);line-height:1.75;margin-bottom:12px;padding-left:20px;position:relative}
.userow b{color:var(--navy)}
.udot{position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:50%;background:var(--verm)}
.closing-cta{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-weight:700;color:var(--navy);font-size:16px;line-height:1.65}
/* in-slide nav buttons */
.navb{border:0;background:linear-gradient(150deg,#2A3A41,#1B282E);color:#fff;font-size:14px;font-weight:700;padding:12px 22px;border-radius:10px;letter-spacing:.03em;box-shadow:0 10px 22px -12px rgba(33,48,57,.8);transition:transform .15s,box-shadow .15s}
.navb.ghost{background:#fff;border:1px solid var(--navy);color:var(--navy);box-shadow:var(--sh-sm)}
.navb.flat{background:#fff;border:1px solid var(--line);color:var(--navy);box-shadow:var(--sh-sm)}
.navb.corner{position:absolute;right:74px;bottom:72px}
.navb:hover{transform:translateY(-2px);box-shadow:var(--sh-lift)}
/* ===== audience runtime ===== */
.aud{position:fixed;inset:0;background:radial-gradient(120% 100% at 50% 0%,#1b2228,#0e1216);display:grid;place-items:center}
.aud .stagewrap{box-shadow:0 40px 100px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04)}
.actrl{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(24,30,35,.78);backdrop-filter:blur(10px);padding:8px 12px;border-radius:999px;opacity:0;transition:.25s;z-index:50;border:1px solid rgba(255,255,255,.08)}
body:hover .actrl,.actrl:focus-within{opacity:1}
.actrl button{border:0;background:transparent;color:#cdd3d6;font-size:14px;padding:6px 13px;border-radius:999px;font-weight:500}
.actrl button:hover{background:rgba(255,255,255,.12);color:#fff}
.actrl .ind{color:#8b939a;font-size:13px;padding:0 6px;letter-spacing:.04em}
/* ===== presenter ===== */
.pres{position:fixed;inset:0;display:grid;grid-template-columns:300px 1fr 360px;grid-template-rows:56px 1fr;background:#12171b;color:#e7ebee;font-size:14px}
.pres-top{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid #232b31;background:#0d1215}
.pres-top .brand{font-weight:700;font-size:15px;color:#fff;letter-spacing:.02em}
.pres-top .brand small{color:#7d868d;font-weight:400;margin-left:8px;letter-spacing:0}
.openbtn{margin-left:auto;background:linear-gradient(135deg,#C9542F,#A83E22);color:#fff;border:0;font-weight:700;padding:10px 18px;border-radius:9px;font-size:13.5px;box-shadow:0 10px 24px -12px rgba(201,84,47,.9)}
.openbtn:hover{filter:brightness(1.06)}
.status{font-size:12.5px;color:#8b939a;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#5a636a}
.dot.on{background:#4fc26f;box-shadow:0 0 0 3px rgba(79,194,111,.2)}
.pres-list{grid-row:2;overflow:auto;border-right:1px solid #232b31;background:#0d1215}
.pli{display:flex;gap:11px;padding:12px 18px;border-bottom:1px solid #1a2126;cursor:pointer;align-items:baseline}
.pli:hover{background:#161e24}
.pli.cur{background:#1a2730;border-left:3px solid #C9542F;padding-left:15px}
.pli-n{color:#7d868d;font-size:12px;width:26px;flex:none;font-family:var(--serif)}
.pli-t{font-size:13px;color:#c9d0d4;line-height:1.45}
.pli.cur .pli-t{color:#fff;font-weight:700}
.pres-mid{grid-row:2;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px}
.preview{background:#000;border-radius:12px;overflow:hidden;align-self:center;box-shadow:0 20px 44px -22px rgba(0,0,0,.8)}
.note{background:#141c22;border:1px solid #232b31;border-radius:14px;padding:20px 22px;line-height:1.9;font-size:14.5px;white-space:pre-wrap;color:#dbe1e4}
.note b{color:#fff}
.nav-mini{display:flex;gap:8px;justify-content:center}
.nav-mini button{background:#1b2831;border:0;color:#cdd3d6;padding:10px 24px;border-radius:9px;font-size:14px;font-weight:700}
.nav-mini button:hover{background:#243440;color:#fff}
.pres-right{grid-row:2;overflow:auto;border-left:1px solid #232b31;background:#0d1215;padding:20px}
.pr-h{font-size:11.5px;letter-spacing:.14em;color:#7d868d;font-weight:700;margin:6px 0 12px}
.quickrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}

.btab{border-top:1px solid #232b31}
.brow{padding:13px 4px;border-bottom:1px solid #1a2126;cursor:pointer}
.brow:hover{background:#161e24}
.brow .bk{font-weight:700;color:#fff;font-size:13.5px}
.brow .bv{color:#8b939a;font-size:12px;margin-top:3px}
.brow .bto{color:var(--gold2);font-size:12px;font-weight:700;margin-top:3px}
.warn{background:#241726;border:1px solid #452a4a;border-radius:11px;padding:13px 15px;color:#e6c9ec;font-size:12.5px;line-height:1.65;margin-top:16px}

.hubgrid2{grid-template-columns:1fr 1fr;gap:26px}

.ocard{background:#fff;border:1px solid var(--line);border-top:5px solid var(--ic);border-radius:var(--radius);padding:32px 28px;box-shadow:var(--sh-sm)}
.ocard .on{width:44px;height:44px;border-radius:50%;background:var(--it);color:var(--ic);font-family:var(--serif);font-weight:700;font-size:20px;display:grid;place-items:center;margin-bottom:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.ocard .oh{font-family:var(--serif);font-weight:700;font-size:21px;color:var(--navy);line-height:1.45;letter-spacing:.02em}
.ocard .ob{font-size:15px;color:var(--inkSoft);line-height:1.65;margin-top:12px}
.benef{display:grid;grid-template-columns:1.05fr 1fr;gap:30px}

.bp{display:flex;gap:15px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px 24px;font-size:16.5px;color:var(--ink);line-height:1.6;box-shadow:var(--sh-sm)}

.plcard .plb{font-size:15px;color:var(--inkSoft);line-height:1.7;margin-top:14px}

R+NFFZf8vDzp/CzQX5XUDjGKJP9YaKKcl7j9Tk6jogHfDAEY+lFFFc8IRd7oym2mf/2Q==')\">\n    <div class=\"hero-scrim\"></div>\n    <div class=\"hero-body\">\n      <div class=\"hero-top\">\n        <span class=\"hero-seal\"><svg viewBox=\"0 0 80 80\"><g fill=\"none\" stroke=\"currentColor\"><circle cx=\"40\" cy=\"40\" r=\"37\" stroke-width=\"1.4\"/><circle cx=\"40\" cy=\"40\" r=\"30\" stroke-width=\"1\"/><g stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M40 30c-4 0-7 3-7 7 0 5 7 10 7 10s7-5 7-10c0-4-3-7-7-7z\"/><path d=\"M40 30c1.5-2.5 4-3.5 6.5-3-1 2.5-3.5 3.5-6.5 3z\"/></g></g></svg></span>\n        <span class=\"cov-eyebrow\">介護施設・保育園むけ ｜ 果物のサブスク</span>\n      </div>\n      <h1 class=\"cov-ttl\">山形の旬を、<br>毎月の楽しみに。</h1>\n      <div class=\"hero-rule\"></div>\n      <p class=\"cov-sub\">季節に応じた果物を、毎月1回・13か月お届け。<br>働く方にも、暮らす方にも、季節の楽しみを施設全体へ。</p>\n      <div class=\"cov-chips\"><span>職員の福利厚生</span><span>入居者・園児へ</span><span>ご家族の贈り物</span><span>1名から</span></div>\n    </div>\n    <div class=\"cov-foot\">株式会社フードサプライズ</div>\n  </div>","note":"【表紙｜最初の30秒】\n名乗り＋一言。読み上げ例：『本日はお時間ありがとうございます。株式会社フードサプライズの〇〇です。山形の旬の果物を、毎月1回・13か月お届けするサービスをご案内します。介護施設・保育園さまでのご利用が増えています。』\n■つかみ：“毎月の楽しみ”というキーワードで、堅い提案にしない。\n→ 次は Slide 2。"},{"n":2,"kind":"std","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#B5852E\">COMPANY ｜ ご挨拶と本日の趣旨</div><h1 class=\"ttl\">山形から、毎月の“旬”を施設へ</h1>\n  <div class=\"two\" style=\"margin-top:34px\">\n    <div class=\"panel-soft\">\n      <div class=\"ph\">私たちについて</div>\n      <p class=\"pp\">山形は四季を通じて果物が豊富な“果樹王国”。<br>地元農家とのネットワークを大切にし、旬の果物を産地から直接お届けしています。近年は、介護施設・保育園さまからのご相談が増えています。</p>\n    </div>\n    <div class=\"panel-navy\">\n      <div class=\"ph gold\">本日の趣旨</div>\n      <p class=\"pp light\"<br><b>毎月の旬の果物を、御施設のどなたに・どう楽しんでいただけそうか</b>を、一緒に整理させてください。</p>\n    </div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>2 / 19</span></div></div>","note":"【会社紹介・趣旨｜約40秒】\n『山形の農家ネットワークから旬を直接お届けしています。本日は、御施設のどなたに・どう楽しんでいただけそうかを一緒に整理させてください。』\n■相談型トーン。押し売りにしない。\n→ 次は Slide 3。"},{"n":3,"kind":"std","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#3C7A4E\">SERVICE ｜ サービスの核</div><h1 class=\"ttl\">季節に応じた果物を、13か月お届け</h1>\n  <p class=\"lead\" style=\"margin-top:18px\">毎月1回、その時期に一番おいしい山形の旬が届きます。<b>「今月は何かな」</b>という、毎月の小さな楽しみが続きます。</p>\n  <div class=\"tl2\" style=\"margin-top:44px\">\n    <div class=\"tl2-line\"></div>\n    <div class=\"tl2-node\">\n      <div class=\"tl2-fruit\" style=\"color:#C0392B\"><svg viewBox=\"0 0 40 40\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"15\" cy=\"28\" r=\"6.5\"/><circle cx=\"27\" cy=\"30\" r=\"6.5\"/><path d=\"M15 21.5C16 13 22 10 27 8M27 23.5C26 16 28 12 27 8\"/><path d=\"M27 9c2.5-2.2 6-2 8 .6-2.6 2-6 1.8-8-.6z\"/></g></svg></div>\n      <div class=\"tl2-dot\" style=\"background:#C0392B\"></div>\n      <div class=\"tl2-mo\">6月</div><div class=\"tl2-f\">さくらんぼ</div></div><div class=\"tl2-node\">\n      <div class=\"tl2-fruit\" style=\"color:#E0904A\"><svg viewBox=\"0 0 40 40\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 11c-6 0-11 4-11 10.5S14 32 20 32s11-4.5 11-10.5S26 11 20 11z\"/><path d=\"M20 13c-2 3-2 6.5 0 9.5\"/><path d=\"M20 11c2-3 5-4.2 8.5-3.2C27.3 11 24 12 20 11z\"/></g></svg></div>\n      <div class=\"tl2-dot\" style=\"background:#E0904A\"></div>\n      <div class=\"tl2-mo\">8月</div><div class=\"tl2-f\">桃・メロン</div></div><div class=\"tl2-node\">\n      <div class=\"tl2-fruit\" style=\"color:#CE7A28\"><svg viewBox=\"0 0 40 40\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 15c-7 0-12 3.6-12 8.5S13 32 20 32s12-3.6 12-8.5S27 15 20 15z\"/><path d=\"M13.5 15c2-2 4.2-3 6.5-3s4.5 1 6.5 3M20 11.5V15M15 13.6l-1.8-2.8M25 13.6l1.8-2.8\"/></g></svg></div>\n      <div class=\"tl2-dot\" style=\"background:#CE7A28\"></div>\n      <div class=\"tl2-mo\">10月</div><div class=\"tl2-f\">柿</div></div><div class=\"tl2-node\">\n      <div class=\"tl2-fruit\" style=\"color:#5F8F63\"><svg viewBox=\"0 0 40 40\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c-2 0-3.2 1.8-3.2 3.8 0 3-5 4-5 10 0 5.2 4 8.2 8.2 8.2s8.2-3 8.2-8.2c0-6-5-7-5-10 0-2-1.2-3.8-3.2-3.8z\"/><path d=\"M20 13c1-3 3.2-5 6.4-5-.8 3.2-3.2 5-6.4 5z\"/></g></svg></div>\n      <div class=\"tl2-dot\" style=\"background:#5F8F63\"></div>\n      <div class=\"tl2-mo\">11月</div><div class=\"tl2-f\">ラ・フランス</div></div><div class=\"tl2-node\">\n      <div class=\"tl2-fruit\" style=\"color:#A6324B\"><svg viewBox=\"0 0 40 40\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 15c-2-2-5-2.2-7.2-1-3 1.8-4 6-2 11 1.4 3.8 3.8 6.6 5.8 6.6 1 0 1.8-.5 3.4-.5s2.4.5 3.4.5c2 0 4.4-2.8 5.8-6.6 2-5 1-9.2-2-11-2.2-1.2-5.2-1-7.2 1z\"/><path d=\"M20 15c0-3 1.2-5 4-6\"/></g></svg></div>\n      <div class=\"tl2-dot\" style=\"background:#A6324B\"></div>\n      <div class=\"tl2-mo\">12月</div><div class=\"tl2-f\">サンふじ</div></div>\n  </div>\n  <p class=\"note-c\" style=\"margin-top:44px\">配送の月・回数・内容量は、御施設のご希望に合わせて調整できます。</p><div class=\"foot\"><span>株式会社フードサプライズ</span><span>3 / 19</span></div></div>","note":"【サービスの核｜約45秒】\n『毎月1回、その時期の一番おいしい山形の果物が届きます。“今月は何かな”という毎月の楽しみが続きます。配送月・回数・量は御施設に合わせて調整できます。』\n■13か月＝実質1年強。契約は1年単位／開始月は自由（4月でも9月でも可）。\n※月数は12/13で最終確定を先方に確認する前提。スライドは13か月表記。\n→ 次は Slide 4（施設の種類を選ぶ）。"},{"n":4,"kind":"hub","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#C8432B\">MENU ｜ 施設の種類をお選びください</div><h1 class=\"ttl\">どちらの施設向けにご覧になりますか</h1>\n  <div class=\"hcardwrap\" style=\"margin-top:32px\"><button class=\"hcard\" data-goto=\"5\" style=\"--ic:#2F7A6B;--it:#E7F1EF;--id:#1C4E45\">\n    <span class=\"hcard-ghost\">介護施設</span>\n    <span class=\"hcard-idx\">01</span>\n    <span class=\" ill=\"none\" stroke=\"#fff\" stroke-width=\"2.6\" stroke-linejoin=\"round\"/></svg></span>\n  </div>\n  <div class=\"pad pad-band-xl\">\n    <div class=\"grid3\" style=\"--ic:#2F7A6B;--it:#E7F1EF\">\n      <div class=\"ocard\" style=\"--ic:#2F7A6B;--it:#E7F1EF\"><div class=\"on\">1</div><div class=\"oh\">施設で働く職員の方へ</div><div class=\"ob\">日々の癒し・福利厚生に</div></div><div class=\"ocard\" style=\"--ic:#2F7A6B;--it:#E7F1EF\"><div class=\"on\">2</div><div class=\"oh\">施設で暮らす入居者の方へ</div><div class=\"ob\">季節を感じる毎月の楽しみに</div></div><div class=\"ocard\" style=\"--ic:#2F7A6B;--it:#E7F1EF\"><div class=\"on\">3</div><div class=\"oh\">ご家族から入居者様への贈り物にも</div><div class=\"ob\">離れて暮らすご家族の想いを届ける</div></div>\n    </div>\n    <div class=\"band-navrow\"><button class=\"navb flat\" data-goto=\"4\">◀ メニュー</button></div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>5 / 19</span></div>","note":"【介護施設｜3つの届け先｜約30秒】\n『介護施設さまでは、大きく3つの使い方があります。働く職員の方、暮らす入居者の方、そしてご家族から入居者様への贈り物です。』\n→ 職員(6)→入居者(7)→ご家族(8)の順で。関心が強いものから触れてOK。メニューはSlide4。"},{"n":6,"kind":"benef","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#2F7A6B\">介護施設 ｜ 職員の方へ</div><h1 class=\"ttl\">施設で働く職員の方へ</h1>\n  <div class=\"benef\" style=\"--ic:#2F7A6B;--it:#E7F1EF\">\n    <div class=\"benef-state\"><span class=\"benef-quote\" style=\"color:#2F7A6B\">“</span><div class=\"bs-h\">毎月届く旬の果物が、休憩時間の小さな楽しみに。多忙な現場への、続けやすい福利厚生。</div></div>\n    <div class=\"benef-points\">\n      <div class=\"bp\"><span class=\"bpi\">●</span><span>届いた果物は施設内で自由に分けられます</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>“職員か否か”で不公平になりにくい</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>毎月なので、続く楽しみになります</span></div>\n    </div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>6 / 19</span></div></div>","note":"【介護施設｜職員の方へ｜約45秒】\n『毎月届く果物が、休憩時間のちょっとした楽しみに。届いた後は施設で自由に分けられるので、“職員か否か”で不公平になりにくいのが好評です。』\n■以前の懸念（社員・非社員の不公平）は“分配自由”で解消できる点を必ず添える。"},{"n":7,"kind":"benef","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#2F7A6B\">介護施設 ｜ 入居者の方へ</div><h1 class=\"ttl\">施設で暮らす入居者の方へ</h1>\n  <div class=\"benef\" style=\"--ic:#2F7A6B;--it:#E7F1EF\">\n    <div class=\"benef-state\"><span class=\"benef-quote\" style=\"color:#2F7A6B\">“</span><div class=\"bs-h\">「今月はさくらんぼ」「来月は桃」。季節の果物が、毎月の会話ときっかけを生みます。</div></div>\n    <div class=\"benef-points\">\n      <div class=\"bp\"><span class=\"bpi\">●</span><span>旬の果物で季節を感じられます</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>食べにくい果物は変更を相談できます</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>会話・レクリエーションのきっかけに</span></div>\n    </div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>7 / 19</span></div></div>","note":"【介護施設｜入居者の方へ｜約45秒】\n『「今月はさくらんぼ」「来月は桃」。季節の果物が、毎月の会話やレクのきっかけになります。食べにくい果物は変更も相談できます。』\n■“季節を感じられる”“会話が生まれる”という情緒価値を前面に。"},{"n":8,"kind":"benefEnd","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#2F7A6B\">介護施設 ｜ ご家族の想い</div><h1 class=\"ttl\">ご家族から入居者様への贈り物にも</h1>\n  <div class=\"benef\" style=\"--ic:#2F7A6B;--it:#E7F1EF\">\n    <div class=\"benef-state\"><span class=\"benef-quote\" style=\"color:#2F7A6B\">“</span><div class=\"bs-h\">離れて暮らすご家族に代わって、毎月旬の果物をお届け。会いに行けない月も、季節を届けられます。</div></div>\n    <div class=\"benef-points\">\n      <div class=\"bp\"><span class=\"bpi\">●</span><span>ご家族が“毎月の贈り物”として使えます</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>1名から申し込めます</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>のし・メッセージも相談できます</span></div>\n    </div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>8 / 19</span></div></div><div class=\"dnav\"><button class=\"navb flat\" data-goto=\"4\">◀ メニュー</button><button class=\"navb \" data-goto=\"13\">共通プランへ ▶</button></div>","note":"【介護施設｜ご家族からの贈り物｜約45秒】\n『離れて暮らすご家族に代わって、毎月旬をお届けする使い方も。会いに行けない月も季節を届けられます。1名から申込でき、のしも相談可です。』\n→ 次は共通プラン(Slide13)。メニューはSlide4。"},{"n":9,"kind":"ov","html":"<div class=\"band band-xl\" style=\"background:linear-gradient(122deg,#E08A2B,color-mix(in srgb,#E08A2B,#0e1f1b 52%))\">\n    <span class=\"band-ghost\">保育園</span>\n    <div class=\"band-idx\">02</div>\n    <div class=\"band-txt\">\n      <div class=\"band-kick\">保育園むけ ｜ 3つの届け先</div>\n      <div class=\"band-name\">保育園で、こう活きます</div>\n    </div>\n    <span class=\"band-ic\"><svg viewBox=\"0 0 48 48\"><circle cx=\"24\" cy=\"24\" r=\"9\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.6\"/><path d=\"M24 6v5M24 37v5M6 24h5M37 24h5M11 11l3.5 3.5M33.5 33.5L37 37M37 11l-3.5 3.5M14.5 33.5L11 37\" stroke=\"#fff\" stroke-width=\"2.6\" stroke-linecap=\"round\"/></svg></span>\n  </div>\n  <div class=\"pad pad-band-xl\">\n    <div class=\"grid3\" style=\"--ic:#E08A2B;--it:#FBF1E1\">\n      <div class=\"ocard\" style=\"--ic:#E08A2B;--it:#FBF1E1\"><div class=\"on\">1</div><div class=\"oh\">園で働く保育士の方へ</div><div class=\"ob\">福利厚生・日々のリフレッシュに</div></div><div class=\"ocard\" style=\"--ic:#E08A2B;--it:#FBF1E1\"><div class=\"on\">2</div><div class=\"oh\">園児の食育・おやつに</div><div class=\"ob\">旬の果物で季節を学ぶ</div></div><div class=\"ocard\" style=\"--ic:#E08A2B;--it:#FBF1E1\"><div class=\"on\">3</div><div class=\"oh\">行事・ご家庭向けにも</div><div class=\"ob\">父母会・記念の品として</div></div>\n    </div>\n    <div class=\"band-navrow\"><button class=\"navb flat\" data-goto=\"4\">◀ メニュー</button></div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>9 / 19</span></div>","note":"【保育園｜3つの届け先｜約30秒】\n『保育園さまでは、保育士の方への福利厚生、園児の食育・おやつ、そして行事やご家庭向けの3つが考えられます。』\n→ 保育士(10)→園児(11)→行事(12)。メニューはSlide4。"},{"n":10,"kind":"benef","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#E08A2B\">保育園 ｜ 保育士の方へ</div><h1 class=\"ttl\">園で働く保育士の方へ</h1>\n  <div class=\"benef\" style=\"--ic:#E08A2B;--it:#FBF1E1\">\n    <div class=\"benef-state\"><span class=\"benef-quote\" style=\"color:#E08A2B\">“</span><div class=\"bs-h\">多忙な先生方へ、毎月届く季節の果物を福利厚生に。休憩のひとときの楽しみに。</div></div>\n    <div class=\"benef-points\">\n      <div class=\"bp\"><span class=\"bpi\">●</span><span>届いた果物は園内で自由に分けられます</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>少人数からでも始められます</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>毎月なので、続く楽しみになります</span></div>\n    </div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>10 / 19</span></div></div>","note":"【保育園｜保育士の方へ｜約40秒】\n『多忙な先生方の休憩の楽しみに。毎月続く福利厚生として。届いた後は園で自由に分けられます。少人数からでも始められます。』"},{"n":11,"kind":"benef","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#E08A2B\">保育園 ｜ 園児の食育</div><h1 class=\"ttl\">園児の食育・おやつに季節の果物</h1>\n  <div class=\"benef\" style=\"--ic:#E08A2B;--it:#FBF1E1\">\n    <div class=\"benef-state\"><span class=\"benef-quote\" style=\"color:#E08A2B\">“</span><div class=\"bs-h\">「これは何の果物かな？」旬の果物が、食育と季節の学びのきっかけになります。</div></div>\n    <div class=\"benef-points\">\n      <div class=\"bp\"><span class=\"bpi\">●</span><span>旬の果物で季節を感じる食育に</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>アレルギー・苦手は変更を相談できます</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>毎月の“おやつの楽しみ”に</span></div>\n    </div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>11 / 19</span></div></div>","note":"【保育園｜園児の食育・おやつ｜約45秒】\n『「これは何の果物かな？」旬の果物が、食育と季節の学びのきっかけに。アレルギーや苦手は変更を相談できます。』\n■食育・季節の学びという価値を強調。安全面（アレルギー配慮）も触れる。"},{"n":12,"kind":"benefEnd","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#E08A2B\">保育園 ｜ 行事・ご家庭</div><h1 class=\"ttl\">行事・ご家庭向けにも</h1>\n  <div class=\"benef\" style=\"--ic:#E08A2B;--it:#FBF1E1\">\n    <div class=\"benef-state\"><span class=\"benef-quote\" style=\"color:#E08A2B\">“</span><div class=\"bs-h\">父母会や卒園記念、季節の行事の品として。ご家庭への“季節のおすそ分け”にも。</div></div>\n    <div class=\"benef-points\">\n      <div class=\"bp\"><span class=\"bpi\">●</span><span>行事・記念の品として使えます</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>施設あてにまとめて配送できます</span></div><div class=\"bp\"><span class=\"bpi\">●</span><span>のし・メッセージも相談できます</span></div>\n    </div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>12 / 19</span></div></div><div class=\"dnav\"><button class=\"navb flat\" data-goto=\"4\">◀ メニュー</button><button class=\"navb \" data-goto=\"13\">共通プランへ ▶</button></div>","note":"【保育園｜行事・ご家庭向け｜約40秒】\n『父母会や卒園記念、季節の行事の品としても。施設あてにまとめて届くので配りやすいです。』\n→ 次は共通プラン(Slide13)。メニューはSlide4。"},{"n":13,"kind":"std","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#3C7A4E\">PLAN ｜ 始めやすさ</div><h1 class=\"ttl\">1名から始められる、13か月プラン</h1>\n  <p class=\"lead\" style=\"margin-top:18px\">「まず少人数で試したい」でも大丈夫。<b>おひとりからでも、施設全体でも</b>、始め方は選べます。</p>\n  <div class=\"grid3\" style=\"margin-top:32px\">\n    <div class=\"plcard\"><div class=\"plh\">1名から申込OK</div><div class=\"plb\">施設単位の契約でなくても、入居者・職員おひとりから始められます。</div></div><div class=\"plcard\"><div class=\"plh\">13か月お届け</div><div class=\"plb\">毎月1回、季節に合わせて旬の果物が届きます。</div></div><div class=\"plcard\"><div class=\"plh\">開始月は自由</div><div class=\"plb\">4月でも9月でも、御施設の好きな月からスタートできます。</div></div>\n  </div>\n  <p class=\"note-c\" style=\"margin-top:30px\">まずはサンプルのご用意も相談できます。「食べてみてから」も可能です。</p><div class=\"foot\"><span>株式会社フードサプライズ</span><span>13 / 19</span></div></div>","note":"【共通｜プラン・始めやすさ｜約45秒】\n『施設単位でなくても、入居者や職員おひとりから始められます。毎月1回・13か月、開始月も自由です。まずサンプルからでも大丈夫です。』\n■“1名からOK”は導入ハードルを下げる最重要ポイント。少数でも遠慮なくトスできる。\n→ 次は Slide14（料金）。"},{"n":14,"kind":"std","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#C8432B\">PRICING ｜ 2つのプラン</div><h1 class=\"ttl\">3,500円／6,000円の2プラン</h1>\n  <div class=\"price\" style=\"margin-top:26px\">\n    <div class=\"pc pc-navy\">\n      <div class=\"pc-badge\">ボリューム</div>\n      <div class=\"pc-name gold\">プレミアム</div>\n      <div class=\"pc-amt\"><b>6,000</b><span class=\"pc-unit\">円</span></div>\n      <div class=\"pc-per light\">/ 名・月（税別）</div>\n      <p class=\"pc-desc light\">特選の旬果物をたっぷり。満足度を重視したプラン。</p>\n    </div>\n    <div class=\"pc pc-paper\">\n      <div class=\"pc-name verm\">スタンダード</div>\n      <div class=\"pc-amt dark\"><b>3,500</b><span class=\"pc-unit\">円</span></div>\n      <div class=\"pc-per mute\">/ 名・月（税別）</div>\n      <p class=\"pc-desc\">季節の果物を手軽に。続けやすいプラン。</p>\n    </div>\n    <div class=\"pc pc-tint\">\n      <div class=\"pc-name verm\">どちらも 13か月お届け</div>\n      <p class=\"pc-mix\">毎月1回、旬の果物をお届け。<br><b>内容量・品種・配送月</b>は相談して調整できます。</p>\n      <p class=\"pc-mix2\">利用人数は1名から。施設全体でのご利用も可能です。</p>\n    </div>\n  </div>\n  <div class=\"price-note\"><span class=\"pn-h\">料金について</span><span class=\"pn-b\">表示は1名あたり・1か月あたりの税別金額です。クール便の送料やお支払い方法の詳細は、次回までに確認のうえご案内します。</span></div>\n  <button class=\"navb flat corner\" data-goto=\"4\">◀ メニュー</button><div class=\"foot\"><span>株式会社フードサプライズ</span><span>14 / 19</span></div></div>","note":"【共通｜料金｜約45秒】\n『プランは2つ。プレミアム6,000円、スタンダード3,500円、いずれも1名・1か月あたりの税別です。どちらも13か月お届けで、内容量や配送月は相談できます。』\n■価格は3,500円／6,000円が正（旧資料の3,000円は誤り）。\n■クール便送料の扱い・支払方法（前払い/月払い）は未確定→次回確認事項へ。\n→ 次は Slide15。"},{"n":15,"kind":"std","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#3C7A4E\">FLEXIBILITY ｜ 柔軟な対応</div><h1 class=\"ttl\">果物の好み・内容の変更も相談できます</h1>\n  <div class=\"two\" style=\"margin-top:26px\">\n    <div class=\"panel-soft\">\n      <div class=\"ph\">できること</div>\n      <ul class=\"notelist\" style=\"margin-top:4px\">\n        <li>食べられない果物は、別の果物への変更を相談できます</li>\n        <li>その月の旬に合わせて内容が決まります</li>\n        <li>果物以外（お米・トマト 等）も、時期により対応できる場合があります</li>\n        <li>アレルギー・苦手への配慮もご相談ください</li>\n      </ul>\n    </div>\n    <div class=\"panel-tint\">\n      <div class=\"ph verm\">たとえば</div>\n      <p class=\"pp\" style=\"font-size:17px\">「スイカは食べにくい」<br>→ <b>ブルーベリーに変更</b>、など。</p>\n      <p class=\"pp\" style=\"margin-top:14px;color:var(--inkSoft)\">入居者・園児それぞれの事情に合わせて、無理なく続けられる形にできます。</p>\n    </div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>15 / 19</span></div></div>","note":"【共通｜柔軟な対応｜約40秒】\n『食べられない果物は別の果物に変更できます。果物以外（お米・トマト等）も時期により対応可能な場合があります。』\n■実例（スイカ→ブルーベリー等）を添えると伝わりやすい。"},{"n":16,"kind":"std","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#1C5E6B\">DELIVERY ｜ 配送</div><h1 class=\"ttl\">施設宛てに、まとめて配送できます</h1>\n  <div class=\"two\" style=\"margin-top:26px\">\n    <div><div class=\"ph\">配送について</div>\n      <div class=\"speclist\"><div class=\"spec\"><span class=\"spec-a\">お届け先</span><span class=\"spec-b\">施設あてに、まとめて一括配送</span></div><div class=\"spec\"><span class=\"spec-a\">梱包</span><span class=\"spec-b\">保冷箱（発泡スチロール等）でお届け</span></div><div class=\"spec\"><span class=\"spec-a\">鮮度</span><span class=\"spec-b\">クール便で鮮度を保って配送</span></div><div class=\"spec\"><span class=\"spec-a\">のし・メッセージ</span><span class=\"spec-b\">ご希望に応じて相談可</span></div></div>\n    </div>\n    <div class=\"panel-navy\">\n      <div class=\"ph gold\">届いたあとは、施設の自由に</div>\n      <p class=\"pp light\" style=\"font-size:17px\">箱で届いた果物を、<b>職員・入居者・園児でどう分けるかは、御施設で自由に</b>決められます。</p>\n      <p class=\"pp light\" style=\"margin-top:14px;color:#c9d2df\">「職員だけ」「入居者も一緒に」など、運用に合わせて分けられるため、不公平になりにくいのが特長です。</p>\n    </div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>16 / 19</span></div></div>","note":"【共通｜配送｜約40秒】\n『施設あてにまとめて一括配送。保冷箱・クール便でお届けします。のしも相談可。届いた後の分け方は御施設の自由です。』\n■“分配自由＝不公平になりにくい”を再度添えると効く。"},{"n":17,"kind":"std","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#B5852E\">CHECK ｜ ご利用にあたって</div><h1 class=\"ttl\">利用人数・配送・支払条件の確認</h1>\n  <p class=\"lead\" style=\"margin-top:16px\">導入に向けて、いくつか一緒に確認させてください。</p>\n  <div class=\"two\" style=\"margin-top:24px\">\n    <div class=\"panel-soft\"><div class=\"ph\">御施設で決めていただくこと</div>\n      <div class=\"cfitem\"><span class=\"cfnum\">1</span><span>利用人数（1名〜／施設全体）</span></div><div class=\"cfitem\"><span class=\"cfnum\">2</span><span>対象（職員・入居者・園児・ご家族 など）</span></div><div class=\"cfitem\"><span class=\"cfnum\">3</span><span>開始したい月</span></div>\n    </div>\n    <div class=\"panel-tint\"><div class=\"ph verm\">当社が確認してご連絡すること</div>\n      <div class=\"cfitem\"><span class=\"cfnum\">1</span><span>クール便の送料の扱い</span></div><div class=\"cfitem\"><span class=\"cfnum\">2</span><span>お支払い方法（前払い・月払い 等）</span></div><div class=\"cfitem\"><span class=\"cfnum\">3</span><span>ご希望に応じたサンプルのご用意</span></div>\n    </div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>17 / 19</span></div></div>","note":"【共通｜ご利用の確認｜約40秒】\n『導入に向けて、利用人数・対象・開始月を御施設側で、送料や支払方法は当社側で確認してご案内します。』\n■ネガはサラッと正直に。隠さない方が信頼になる。\n→ 次は Slide18（クロージング）。"},{"n":18,"kind":"std","html":"<div class=\"pad pad-navy\"><div class=\"kick\" style=\"color:#E9CF9F\">CLOSING ｜ 本日の整理</div><h1 class=\"ttl\">季節の楽しみを、施設全体へ</h1>\n  <p class=\"lead\" style=\"margin-top:22px;color:#dbe1ee\">毎月届く山形の旬が、<b style=\"color:#fff\">働く方・暮らす方・ご家族</b>それぞれの、毎月の楽しみになります。</p>\n  <div class=\"clist\" style=\"margin-top:26px\">\n    <div class=\"crow\"><span class=\"ctag\">介護施設</span><span class=\"cbody\">職員の福利厚生 ／ 入居者の毎月の楽しみ ／ ご家族からの贈り物</span></div><div class=\"crow\"><span class=\"ctag\">保育園</span><span class=\"cbody\">保育士の福利厚生 ／ 園児の食育・おやつ ／ 行事・ご家庭向け</span></div>\n  </div>\n  <div class=\"panel-white\" style=\"margin-top:24px\">\n    <div class=\"closing-cta\" style=\"border:0;padding:0;margin:0\">→ まずは“どなたに・何名から”始めるかを、一緒に決めさせてください。</div>\n  </div><div class=\"foot\"><span>株式会社フードサプライズ</span><span>18 / 19</span></div></div>","note":"【クロージング｜約40秒】\n『毎月の旬が、働く方・暮らす方・ご家族それぞれの楽しみになります。まずは“どなたに・何名から”始めるかを一緒に決めさせてください。』"},{"n":19,"kind":"std","html":"<div class=\"pad\"><div class=\"kick\" style=\"color:#3C7A4E\">NEXT ｜ 次回ご相談まで</div><h1 class=\"ttl\">次回ご相談までの、確認事項</h1>\n  <div class=\"two\" style=\"margin-top:24px\">\n    <div><div class=\"ph\">御施設側で ご検討いただくこと</div>\n      <div class=\"nscard\" style=\"margin-bottom:12px\"><div class=\"ns-h\" style=\"margin:0 0 4px\">1. 利用人数と対象</div><div class=\"ns-b\">職員・入居者・園児など、誰に何名から</div></div><div class=\"nscard\" style=\"margin-bottom:12px\"><div class=\"ns-h\" style=\"margin:0 0 4px\">2. 開始したい月</div><div class=\"ns-b\">いつからスタートするか</div></div><div class=\"nscard\" style=\"margin-bottom:12px\"><div class=\"ns-h\" style=\"margin:0 0 4px\">3. プランの方向性</div><div class=\"ns-b\">3,500円／6,000円のどちら中心か</div></div>\n    </div>\n    <div><div class=\"ph verm\">当社が 確認してご連絡すること</div>\n      <div class=\"nscard\" style=\"margin-bottom:12px;border-left:4px solid var(--verm)\"><div class=\"ns-h\" style=\"margin:0 0 4px\">1. クール便の送料</div><div class=\"ns-b\">送料の扱いを確認しご連絡</div></div><div class=\"nscard\" style=\"margin-bottom:12px;border-left:4px solid var(--verm)\"><div class=\"ns-h\" style=\"margin:0 0 4px\">2. お支払い方法</div><div class=\"ns-b\">前払い・月払いなどの条件を確認</div></div><div class=\"nscard\" style=\"margin-bottom:12px;border-left:4px solid var(--verm)\"><div class=\"ns-h\" style=\"margin:0 0 4px\">3. サンプル</div><div class=\"ns-b\">ご希望に応じてご用意</div></div>\n    </div>\n  </div>\n  <div class=\"sched\"><span class=\"sched-h\">次回のご相談</span><span class=\"sched-b\">これらをふまえて、御施設向けの具体的なプランをご用意します。日程をご相談させてください。</span></div>\n  <button class=\"navb flat corner\" data-goto=\"4\">◀ メニュー</button><div class=\"foot\"><span>株式会社フードサプライズ</span><span>19 / 19</span></div></div>","note":"【次回確認事項｜約40秒】\n御施設側＝人数・対象・開始月・プラン方向性。当社側＝送料・支払方法・サンプル。『次回、これらをふまえて御施設向けの具体プランをご用意します。』\n■未確定（送料・支払方法・月数12/13）は必ず持ち帰り、次回までに先方確認。"}],"branch":[{"k":"介護施設のお客様","view":"職員・入居者・ご家族","to":5},{"k":"保育園のお客様","view":"保育士・園児・行事","to":9},{"k":"少人数で始めたい","view":"1名から/13か月プラン","to":13},{"k":"まず料金を知りたい","view":"3,500円/6,000円","to":14},{"k":"苦手な果物が心配","view":"変更・柔軟対応","to":15},{"k":"条件を確認したい","view":"確認事項","to":[17,19]}],"quick":[["はじめに",1],["メニュー",4],["介護施設",5],["保育園",9],["プラン",13],["料金",14],["クロージング",18],["確認事項",19]]};</script>
<script>
(function(){
  const TITLES=["山形の旬を、 毎月の楽しみに。","山形から、毎月の“旬”を施設へ","季節に応じた果物を、13か月お届け","どちらの施設向けにご覧になりますか","介護施設で、こう活きます","施設で働く職員の方へ","施設で暮らす入居者の方へ","ご家族から入居者様への贈り物にも","保育園で、こう活きます","園で働く保育士の方へ","園児の食育・おやつに季節の果物","行事・ご家庭向けにも","1名から始められる、13か月プラン","3,500円／6,000円の2プラン","果物の好み・内容の変更も相談できます","施設宛てに、まとめて配送できます","利用人数・配送・支払条件の確認","季節の楽しみを、施設全体へ","次回ご相談までの、確認事項"];
  const S=PAYLOAD.slides, BR=PAYLOAD.branch, QK=PAYLOAD.quick;
  const isAud=location.hash.indexOf('audience')>=0;
  const bc=('BroadcastChannel'in window)?new BroadcastChannel('foodsurprise'):null;
  let cur=0;
  const app=document.getElementById('app');

  function makeStage(kind,html){
    const wrap=document.createElement('div');wrap.className='stagewrap';
    const st=document.createElement('div');st.className='stage'+((kind==='cover')?' dark':'');
    st.innerHTML=html;wrap.appendChild(st);return wrap;
  }
  function fit(wrap,maxW,maxH){
    const s=Math.min(maxW/1280,maxH/720);
    const st=wrap.querySelector('.stage');
    st.style.transform='scale('+s+')';
    wrap.style.width=(1280*s)+'px';wrap.style.height=(720*s)+'px';
  }

  /* ---------------- AUDIENCE ---------------- */
  function renderAud(){
    app.innerHTML='';app.className='';
    const root=document.createElement('div');root.className='aud';
    const wrap=makeStage(S[cur].kind,S[cur].html);
    root.appendChild(wrap);
    const ctrl=document.createElement('div');ctrl.className='actrl';
    ctrl.innerHTML='<button data-act="prev">‹ 前</button><span class="ind">'+(cur+1)+' / '+S.length+'</span><button data-act="next">次 ›</button><button data-act="menu">メニュー</button><button data-act="fs">⛶</button>';
    root.appendChild(ctrl);
    app.appendChild(root);
    const resize=()=>fit(wrap,window.innerWidth,window.innerHeight);resize();
    window.__resize=resize;
    wrap.addEventListener('click',onGoto);
    ctrl.addEventListener('click',e=>{const a=e.target.dataset.act;if(a==='next')go(cur+1);else if(a==='prev')go(cur-1);else if(a==='menu')go(4);else if(a==='fs')toggleFS();});
  }
  function onGoto(e){const b=e.target.closest('[data-goto]');if(b){go(parseInt(b.dataset.goto,10)-1);}}
  function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen&&document.exitFullscreen();}
  function go(i,broadcast=true){i=Math.max(0,Math.min(S.length-1,i));cur=i;if(isAud)renderAud();else renderPres();if(broadcast&&bc)bc.postMessage({t:isAud?'pos':'go',i:cur});}

  /* ---------------- PRESENTER ---------------- */
  function renderPres(){
    app.innerHTML='';app.className='';
    const root=document.createElement('div');root.className='pres';
    // top
    const top=document.createElement('div');top.className='pres-top';
    top.innerHTML='<span class="brand">フードサプライズ 商談ビュー<small>商談者用・お客様には共有しないでください</small></span>'
      +'<span class="status"><span class="dot" id="dot"></span><span id="stxt">顧客画面：未接続</span></span>'
      +'<button class="openbtn" id="openaud">🖥 顧客画面を別タブで開く</button>';
    root.appendChild(top);
    // list
    const list=document.createElement('div');list.className='pres-list';
    list.innerHTML=S.map((s,i)=>'<div class="pli'+(i===cur?' cur':'')+'" data-i="'+i+'"><span class="pli-n">'+(i+1)+'</span><span class="pli-t">'+TITLES[i]+'</span></div>').join('');
    root.appendChild(list);
    // mid
    const mid=document.createElement('div');mid.className='pres-mid';
    const pv=document.createElement('div');pv.className='preview';
    const wrap=makeStage(S[cur].kind,S[cur].html);pv.appendChild(wrap);
    const nav=document.createElement('div');nav.className='nav-mini';
    nav.innerHTML='<button data-act="prev">‹ 前</button><button data-act="next">次 ›</button>';
    const note=document.createElement('div');note.className='note';
    note.innerHTML=(S[cur].note||'（このスライドのメモはありません）').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    mid.appendChild(pv);mid.appendChild(nav);mid.appendChild(note);
    root.appendChild(mid);
    // right
    const right=document.createElement('div');right.className='pres-right';
    right.innerHTML='<div class="pr-h">クイックジャンプ</div><div class="quickrow">'
      +QK.map(q=>'<button data-goto="'+q[1]+'">'+q[0]+'</button>').join('')+'</div>'
      +'<div class="pr-h">分岐ルール早見表（相手の言葉 → 進む先）</div><div class="btab">'
      +BR.map(b=>{const to=Array.isArray(b.to)?b.to:[b.to];return '<div class="brow" data-goto="'+to[0]+'"><div class="bk">「'+b.k+'」</div><div class="bv">'+b.view+'</div><div class="bto">→ Slide '+to.join(' / ')+'</div></div>';}).join('')
      +'</div><div class="warn">※ この画面（台本・分岐・メモ）はお客様に見せないでください。Zoom等では「顧客画面」タブだけを共有します。</div>';
    root.appendChild(right);
    app.appendChild(root);
    const resize=()=>fit(wrap,360,260);resize();window.__resize=resize;
    if(audWin&&!audWin.closed)setConn(true);
    // events
    list.addEventListener('click',e=>{const r=e.target.closest('[data-i]');if(r)go(parseInt(r.dataset.i,10));});
    nav.addEventListener('click',e=>{const a=e.target.dataset.act;if(a==='next')go(cur+1);else if(a==='prev')go(cur-1);});
    right.addEventListener('click',e=>{const b=e.target.closest('[data-goto]');if(b)go(parseInt(b.dataset.goto,10)-1);});
    pv.addEventListener('click',e=>{const b=e.target.closest('[data-goto]');if(b)go(parseInt(b.dataset.goto,10)-1);});
    document.getElementById('openaud').addEventListener('click',openAud);
  }
  let audWin=null;
  function setConn(on){const d=document.getElementById('dot'),t=document.getElementById('stxt');if(d)d.className='dot'+(on?' on':'');if(t)t.textContent=on?'顧客画面：接続中':'顧客画面：未接続';}
  function openAud(){const url=location.href.split('#')[0]+'#audience';audWin=window.open(url,'fsAudience');setTimeout(()=>{if(bc)bc.postMessage({t:'go',i:cur});},600);}

  /* ---------------- sync ---------------- */
  if(bc)bc.onmessage=(e)=>{const m=e.data||{};
    if(isAud){ if(m.t==='go'){go(m.i,false);} }
    else { if(m.t==='pos'){go(m.i,false);setConn(true);} if(m.t==='hi'){setConn(true);bc.postMessage({t:'go',i:cur});} }
  };
  // keyboard
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}
    else if(e.key==='ArrowLeft'){go(cur-1);}
    else if(e.key==='Escape'){go(4);}
    else if(e.key==='f'&&isAud){toggleFS();}
  });
  window.addEventListener('resize',()=>{if(window.__resize)window.__resize();});

  // boot
  window.__go=go;
  if(isAud){renderAud();if(bc)bc.postMessage({t:'hi'});}
  else{renderPres();}
})();
</script>
</body></html>
